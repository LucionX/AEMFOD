# Ultralytics YOLO, AGPL-3.0 license; backbone from official 8.3.0.
# Three heads P3/P4/P5: transfer of the original END AEFPN+AWCF neck.
# Original fusion topology; host-native C2f neck feature blocks.
# Small (s) scale only. nc=10 is VisDrone; set nc=15 for DOTA HBB.
nc: 10
scale: s
scales:
  s: [0.33, 0.5, 1024]

backbone:
  - [-1, 1, "Conv", [64, 3, 2]]  # 0
  - [-1, 1, "Conv", [128, 3, 2]]  # 1
  - [-1, 3, "C2f", [128, true]]  # 2
  - [-1, 1, "Conv", [256, 3, 2]]  # 3
  - [-1, 6, "C2f", [256, true]]  # 4
  - [-1, 1, "Conv", [512, 3, 2]]  # 5
  - [-1, 6, "C2f", [512, true]]  # 6
  - [-1, 1, "Conv", [1024, 3, 2]]  # 7
  - [-1, 3, "C2f", [1024, true]]  # 8
  - [-1, 1, "SPPF", [1024, 5]]  # 9

head:
  - [4, 1, "Conv", [64, 1, 1]]  # 10
  - [6, 1, "Conv", [128, 1, 1]]  # 11
  - [9, 1, "Conv", [256, 1, 1]]  # 12
  - [[10, 11, 12], 1, "AWCF3", [64, 0]]  # 13
  - [[10, 11, 12], 1, "AWCF3", [128, 1]]  # 14
  - [[10, 11, 12], 1, "AWCF3", [256, 2]]  # 15
  - [-3, 1, "AEFPNBlock", [64]]  # 16
  - [-3, 1, "AEFPNBlock", [128]]  # 17
  - [-3, 1, "AEFPNBlock", [256]]  # 18
  - [[-1, 15, 17], 1, "ALF2", [128]]  # 19
  - [-1, 3, "C2f", [128, false]]  # 20
  - [[-1, 17, 16], 1, "ALF2", [64]]  # 21
  - [-1, 3, "C2f", [64, false]]  # 22
  - [[22, 20], 1, "AWCF2", [64, 0]]  # 23
  - [[22, 20], 1, "AWCF2", [128, 1]]  # 24
  - [-2, 1, "AEFPNBlock", [64]]  # 25
  - [-2, 1, "AEFPNBlock", [128]]  # 26
  - [-2, 1, "Conv", [256, 1, 1]]  # 27
  - [-2, 1, "Conv", [512, 1, 1]]  # 28
  - [18, 1, "Conv", [1024, 1, 1]]  # 29
  - [[27, 28, 29], 1, "Detect", ["nc"]]  # 30
