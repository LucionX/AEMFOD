# Ultralytics YOLO, AGPL-3.0 license; backbone from official 8.3.0.
# Official three-head baseline; only class count and explicit s scale changed.
# Custom neck follows the author-provided original implementation.
# Small (s) scale only. nc=10 is VisDrone; set nc=15 for DOTA HBB.
nc: 10
scale: s
scales:
  s: [0.5, 0.5, 1024]

backbone:
  - [-1, 1, "Conv", [64, 3, 2]]  # 0
  - [-1, 1, "Conv", [128, 3, 2]]  # 1
  - [-1, 2, "C3k2", [256, false, 0.25]]  # 2
  - [-1, 1, "Conv", [256, 3, 2]]  # 3
  - [-1, 2, "C3k2", [512, false, 0.25]]  # 4
  - [-1, 1, "Conv", [512, 3, 2]]  # 5
  - [-1, 2, "C3k2", [512, true]]  # 6
  - [-1, 1, "Conv", [1024, 3, 2]]  # 7
  - [-1, 2, "C3k2", [1024, true]]  # 8
  - [-1, 1, "SPPF", [1024, 5]]  # 9
  - [-1, 2, "C2PSA", [1024]]  # 10

head:
  - [-1, 1, "nn.Upsample", ["None", 2, "nearest"]]  # 11
  - [[-1, 6], 1, "Concat", [1]]  # 12
  - [-1, 2, "C3k2", [512, false]]  # 13
  - [-1, 1, "nn.Upsample", ["None", 2, "nearest"]]  # 14
  - [[-1, 4], 1, "Concat", [1]]  # 15
  - [-1, 2, "C3k2", [256, false]]  # 16
  - [-1, 1, "Conv", [256, 3, 2]]  # 17
  - [[-1, 13], 1, "Concat", [1]]  # 18
  - [-1, 2, "C3k2", [512, false]]  # 19
  - [-1, 1, "Conv", [512, 3, 2]]  # 20
  - [[-1, 10], 1, "Concat", [1]]  # 21
  - [-1, 2, "C3k2", [1024, true]]  # 22
  - [[16, 19, 22], 1, "Detect", ["nc"]]  # 23
